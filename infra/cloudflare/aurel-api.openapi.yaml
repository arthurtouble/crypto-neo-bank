openapi: 3.0.3
info:
  title: Aurel edge API
  version: 0.1.0
  description: Validation contract for public and authenticated Aurel Worker endpoints. Authentication and authorization remain enforced by the application.
servers:
  - url: https://aurel-financial-os.aurel-events.workers.dev
paths:
  /api/health:
    get:
      operationId: health
      responses:
        "200":
          description: Service and dependency status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503": { description: A required dependency is unavailable }
  /api/support/messenger:
    get:
      operationId: supportMessenger
      responses:
        "200": { description: Intercom app ID and a signed identity token, or appId null when support chat is off }
        "401": { description: Authentication required }
  /api/auth/session:
    get:
      operationId: session
      responses:
        "200": { description: Authenticated session }
        "401": { description: Authentication required }
  /api/activity:
    get:
      operationId: activity
      responses:
        "200": { description: Account activity projection }
        "401": { description: Authentication required }
  /api/webhooks/provider:
    post:
      operationId: providerWebhook
      parameters:
        - in: header
          name: x-provider-signature
          required: true
          schema: { type: string, maxLength: 512 }
        - in: header
          name: x-provider-timestamp
          required: true
          schema: { type: string, maxLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type]
              properties:
                id: { type: string, maxLength: 160 }
                type: { type: string, maxLength: 160 }
              additionalProperties: true
      responses:
        "202": { description: Event authenticated and enqueued }
        "400": { description: Malformed event }
        "401": { description: Invalid signature }
        "409": { description: Replayed event }
components:
  schemas:
    Health:
      type: object
      required: [status, dependencies, observedAt]
      properties:
        status: { type: string, enum: [ok, degraded] }
        observedAt: { type: string, format: date-time }
        dependencies:
          type: object
          additionalProperties: false
          properties:
            database: { type: boolean }
            queue: { type: boolean }
            authentication: { type: boolean }
