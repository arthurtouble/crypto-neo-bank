packages:
  - "apps/*"
  - "packages/*"

confirmModulesPurge: false

overrides:
  ws: 8.21.0
  'undici@>=7.0.0 <7.29.1': 7.29.1
  'uuid@<11.1.1': 11.1.1
  'decode-uri-component@<0.5.0': 0.5.0
  'sharp@<0.35.5': 0.35.5
  'source-map-js@<1.2.2': 1.2.2

allowBuilds:
  "@reown/appkit": false
  bufferutil: false
  esbuild: true
  keccak: false
  unrs-resolver: true
  utf-8-validate: false
  workerd: true

# Advisories with no patched release yet, accepted by the owner on 3 October 2026.
# Both are denial of service in build and docs tooling. Remove each once a fix ships.
# GHSA-ch52-4w7c-c8xp: http-cache-semantics, via Astro in apps/docs.
# GHSA-vfj7-8cjw-p6xm: braces, via fast-glob and micromatch in apps/web's build and lint tooling.
auditConfig:
  ignoreGhsas:
    - GHSA-ch52-4w7c-c8xp
    - GHSA-vfj7-8cjw-p6xm
