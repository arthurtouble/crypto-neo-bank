name: deploy dev

# Every push to main deploys to the isolated dev environment right away, while
# the quality workflow runs alongside it. Dev favors fast iteration: a red
# quality run on main means dev is running code that failed checks until the
# fix lands. Production is never deployed from here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: dev
      url: https://aura-dev.aurel-events.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations are append-only: new numbered files are applied, and dev keeps its data.
      - run: pnpm --filter @aurel/web exec wrangler d1 migrations apply aura-dev-projections --remote --env dev
      - run: pnpm events:deploy:dev
      - run: pnpm deploy:dev
      - run: pnpm ops:deploy:dev
      - run: pnpm docs:deploy:dev
      - run: pnpm test:deployment
        env:
          AURA_SMOKE_URL: https://aura-dev.aurel-events.workers.dev
          AURA_SMOKE_DOCS_URL: https://aura-dev-docs.aurel-events.workers.dev
