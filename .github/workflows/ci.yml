name: quality

# Pull requests run the checks below plus only the end-to-end specs for the
# features they change (scripts/e2e-select.mjs). The full end-to-end suite runs
# every night on main, by hand, and on a pull request labelled full-e2e.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck:all
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm --filter @aurel/ops build
      - run: pnpm test:recovery

  # Which end-to-end specs to run: every spec on the nightly and manual runs and
  # with the full-e2e label, otherwise those for the files this pull request changes.
  # Pushes to main run none here; the nightly run covers main.
  e2e-select:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      specs: ${{ steps.select.outputs.specs }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: select
        env:
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-e2e') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$FULL" = "true" ]; then node scripts/e2e-select.mjs --all
          else node scripts/e2e-select.mjs "$BASE_SHA"; fi

  # The end-to-end tests share one fake chain, so each job runs one test at a time.
  # Jobs run in parallel, each with its own server and fake chain: one per browser
  # for a focused run, and the full suite split into shards per browser.
  e2e:
    needs: e2e-select
    if: needs.e2e-select.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-select.outputs.matrix) }}
    name: e2e (${{ matrix.project }} ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aurel/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }} ${{ needs.e2e-select.outputs.specs }}
