<title>Aura journeys and wireframes</title>
<style>
/* Layout: journey index on the left, the selected journey's storyboard on the right: numbered frames in order, each with its notes. Greyscale on purpose; the only colour marks annotations. */
:root {
  --page: #f4f4f3; --panel: #ffffff; --ink: #1d1d1f; --ink2: #5f6166; --ink3: #8e9096; --line: #d9d9dc; --line2: #bfc0c4;
  --wf-bg: #ffffff; --wf-fill: #eeeeef; --wf-fill2: #e2e2e4; --wf-ink: #2a2a2d; --wf-ink2: #707278; --wf-line: #c9cacd; --wf-strong: #2a2a2d; --wf-on-strong: #ffffff;
  --note: #d9480f; --note-bg: #fff1e8; --focus: #2d5bd7;
  --f: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --m: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #121214; --panel: #1b1b1e; --ink: #ececee; --ink2: #a4a5aa; --ink3: #75767c; --line: #2c2c30; --line2: #3a3a3f;
  --note: #ff8a4c; --note-bg: #3a2418; --focus: #7ea2ff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #121214; --panel: #1b1b1e; --ink: #ececee; --ink2: #a4a5aa; --ink3: #75767c; --line: #2c2c30; --line2: #3a3a3f;
  --note: #ff8a4c; --note-bg: #3a2418; --focus: #7ea2ff; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font: 14px/1.5 var(--f); padding-inline: 16px; padding-block: 0 64px; }
.app { max-width: 1560px; margin: 0 auto; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; }
header.top { grid-column: 1 / -1; padding-block: 24px 4px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
header.top h1 { margin: 0; font-size: 24px; line-height: 1.2; }
header.top p { margin: 4px 0 0; color: var(--ink2); max-width: 80ch; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { font: 500 13px var(--f); color: var(--ink2); background: none; border: 0; padding: 7px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--ink); background: var(--page); box-shadow: inset 0 -2px 0 var(--ink); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
nav.index { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: 100vh; overflow-y: auto; padding-block: 12px 24px; }
nav.index h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink3); margin: 16px 0 4px; }
nav.index a { display: grid; grid-template-columns: 34px 1fr; padding: 5px 8px; border-radius: 6px; color: var(--ink2); text-decoration: none; font-size: 13px; }
nav.index a b { font: 500 11px var(--m); color: var(--ink3); padding-top: 2px; }
nav.index a[aria-current="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
main { min-width: 0; padding-block: 12px; }
.jhead { display: grid; gap: 6px; max-width: 90ch; margin-bottom: 18px; }
.jhead h2 { margin: 0; font-size: 20px; }
.jhead .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink2); }
.jhead .meta b { color: var(--ink); font-weight: 600; }
.jhead p { margin: 0; }
.board { display: flex; flex-wrap: wrap; gap: 28px 18px; align-items: flex-start; }
.step { display: grid; gap: 8px; min-width: 0; position: relative; }
.step .lbl { font-size: 12px; font-weight: 600; color: var(--ink2); display: flex; gap: 8px; align-items: baseline; }
.step .lbl i { font: 600 11px var(--m); font-style: normal; color: var(--ink3); }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 12.5px; color: var(--ink2); }
.notes li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
.arrow { align-self: center; color: var(--ink3); font-size: 20px; }
.open { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 24px; max-width: 90ch; font-size: 13px; }
.open h3 { margin: 0 0 6px; font-size: 13px; }
.open ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink3); }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; } nav.index { position: static; max-height: none; } }

/* ———— Wireframe kit: one neutral palette, no brand styling ———— */
.wf { background: var(--wf-bg); color: var(--wf-ink); font: 11px/1.35 var(--f); border: 1px solid var(--line2); position: relative; overflow: hidden; }
.wf.desk { width: 640px; height: 400px; border-radius: 6px; display: grid; grid-template-columns: 52px 1fr; }
.wf.phone { width: 236px; height: 480px; border-radius: 20px; border: 5px solid #2a2a2d; display: grid; grid-template-rows: auto 1fr auto auto; }
.scroller { overflow-x: auto; max-width: 100%; }
.wf * { margin: 0; }
.wf .rail { border-right: 1px solid var(--wf-line); display: grid; align-content: start; justify-items: center; gap: 6px; padding: 10px 0; }
.wf .rail i { width: 26px; height: 22px; border-radius: 5px; background: var(--wf-fill); display: grid; place-items: center; font-style: normal; font-size: 7.5px; color: var(--wf-ink2); }
.wf .rail i.on { background: var(--wf-strong); color: var(--wf-on-strong); }
.wf .rail .logo { width: 22px; height: 22px; border-radius: 50%; background: var(--wf-fill2); margin-bottom: 6px; }
.wf .dcol { display: grid; grid-template-rows: 34px 1fr; min-width: 0; }
.wf .dbar { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--wf-line); }
.wf .search { flex: 0 1 200px; height: 20px; border-radius: 5px; background: var(--wf-fill); color: var(--wf-ink2); padding: 0 8px; display: flex; align-items: center; justify-content: space-between; font-size: 9.5px; }
.wf .sp { flex: 1; }
.wf .ico { width: 20px; height: 20px; border-radius: 50%; background: var(--wf-fill); display: grid; place-items: center; font-size: 9px; color: var(--wf-ink2); flex: none; }
.wf .dmain { padding: 12px 14px; overflow: hidden; display: grid; gap: 10px; align-content: start; }
.wf .pbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; min-height: 36px; }
.wf .pbar b { font-size: 13px; }
.wf .pmain { padding: 4px 12px 10px; overflow: hidden; display: grid; gap: 8px; align-content: start; }
.wf .tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--wf-line); padding: 6px 2px 10px; text-align: center; font-size: 8.5px; color: var(--wf-ink2); }
.wf .tabs span::before { content: ""; display: block; width: 14px; height: 14px; border-radius: 4px; background: var(--wf-fill2); margin: 0 auto 2px; }
.wf .tabs .on { color: var(--wf-ink); font-weight: 700; } .wf .tabs .on::before { background: var(--wf-strong); }
.wf .tabs .mv::before { width: 26px; height: 26px; border-radius: 50%; background: var(--wf-strong); margin-top: -8px; }
.wf h3 { font-size: 13px; font-weight: 700; }
.wf h4 { font-size: 11px; font-weight: 700; }
.wf .muted { color: var(--wf-ink2); }
.wf .big { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.wf .huge { font-size: 30px; font-weight: 700; text-align: center; }
.wf .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.wf .between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wf .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; align-items: start; }
.wf .stack { display: grid; gap: 6px; align-content: start; }
.wf .btn { display: inline-flex; align-items: center; justify-content: center; height: 22px; padding: 0 10px; border-radius: 5px; border: 1px solid var(--wf-line); background: var(--wf-bg); font-weight: 600; font-size: 10px; white-space: nowrap; }
.wf .btn.pri { background: var(--wf-strong); color: var(--wf-on-strong); border-color: var(--wf-strong); }
.wf .btn.full { width: 100%; height: 28px; }
.wf .btn.dis { opacity: .4; }
.wf .btn.link { border: 0; padding: 0; height: auto; text-decoration: underline; }
.wf .inp { border: 1px solid var(--wf-line); border-radius: 5px; height: 24px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; color: var(--wf-ink); }
.wf .inp.ph { color: var(--wf-ink2); }
.wf .inp.err { border-color: var(--wf-ink); border-width: 2px; }
.wf .fl { display: grid; gap: 3px; }
.wf .fl > span:first-child { font-size: 9.5px; font-weight: 600; color: var(--wf-ink2); }
.wf .hint { font-size: 9.5px; color: var(--wf-ink2); }
.wf .errtxt { font-size: 9.5px; font-weight: 700; }
.wf .li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--wf-line); }
.wf .li .av { width: 22px; height: 22px; border-radius: 50%; background: var(--wf-fill2); display: grid; place-items: center; font-size: 8px; font-weight: 700; }
.wf .li .t { font-weight: 600; } .wf .li small { display: block; color: var(--wf-ink2); font-size: 9px; }
.wf .li .v { text-align: right; font-weight: 600; } .wf .li .v small { font-weight: 400; }
.wf .th, .wf .tr { display: grid; gap: 8px; padding: 4px 0; align-items: center; }
.wf .th { font-size: 9px; color: var(--wf-ink2); border-bottom: 1px solid var(--wf-ink2); }
.wf .tr { border-bottom: 1px solid var(--wf-line); }
.wf .r { text-align: right; }
.wf .chips { display: flex; gap: 4px; flex-wrap: wrap; }
.wf .chip { border: 1px solid var(--wf-line); border-radius: 99px; padding: 2px 8px; font-size: 9.5px; }
.wf .chip.on { background: var(--wf-strong); color: var(--wf-on-strong); border-color: var(--wf-strong); }
.wf .segc { display: flex; background: var(--wf-fill); border-radius: 5px; padding: 2px; }
.wf .segc span { flex: 1; text-align: center; padding: 3px; border-radius: 4px; font-weight: 600; color: var(--wf-ink2); font-size: 10px; }
.wf .segc .on { background: var(--wf-bg); color: var(--wf-ink); box-shadow: 0 0 0 1px var(--wf-line); }
.wf .box { border: 1px solid var(--wf-line); border-radius: 6px; padding: 8px; display: grid; gap: 6px; align-content: start; }
.wf .fill { background: var(--wf-fill); border-radius: 6px; padding: 8px; display: grid; gap: 6px; }
.wf .ph-img { background: repeating-linear-gradient(45deg, var(--wf-fill), var(--wf-fill) 4px, var(--wf-fill2) 4px, var(--wf-fill2) 8px); border-radius: 6px; display: grid; place-items: center; color: var(--wf-ink2); font-size: 9px; font-weight: 600; }
.wf .skel { height: 8px; border-radius: 4px; background: var(--wf-fill2); }
.wf .kv { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--wf-line); }
.wf .kv span { color: var(--wf-ink2); } .wf .kv b { text-align: right; }
.wf .banner { border: 1px dashed var(--wf-ink2); border-radius: 5px; padding: 5px 8px; font-size: 9.5px; display: flex; gap: 6px; justify-content: space-between; align-items: center; }
.wf .banner.solid { border-style: solid; border-width: 2px; border-color: var(--wf-ink); }
.wf .scrim { position: absolute; inset: 0; background: rgb(40 40 44 / .35); }
.wf .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 250px; background: var(--wf-bg); border-left: 1px solid var(--wf-line2, #aaa); display: grid; grid-template-rows: auto 1fr auto; box-shadow: -8px 0 20px rgb(0 0 0 / .12); }
.wf .modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 300px; background: var(--wf-bg); border-radius: 8px; box-shadow: 0 10px 30px rgb(0 0 0 / .25); display: grid; }
.wf .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--wf-bg); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 20px rgb(0 0 0 / .15); display: grid; }
.wf .sheet::before { content: ""; width: 30px; height: 3px; border-radius: 2px; background: var(--wf-fill2); justify-self: center; margin-top: 6px; }
.wf .drawer, .wf .modal, .wf .sheet, .wf .pop { grid-template-columns: minmax(0, 1fr); }
.wf .kv b { overflow-wrap: anywhere; }
.wf .pop { position: absolute; background: var(--wf-bg); border: 1px solid var(--wf-line); border-radius: 6px; box-shadow: 0 6px 18px rgb(0 0 0 / .15); display: grid; }
.wf .ohead { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 6px; }
.wf .ohead b { font-size: 12px; }
.wf .obody { padding: 4px 12px; display: grid; gap: 8px; align-content: start; overflow: hidden; }
.wf .ofoot { padding: 8px 12px 12px; display: grid; gap: 6px; border-top: 1px solid var(--wf-line); }
.wf .toast { position: absolute; right: 10px; top: 42px; width: 190px; background: var(--wf-bg); border: 1px solid var(--wf-ink2); border-radius: 6px; padding: 6px 8px; box-shadow: 0 4px 12px rgb(0 0 0 / .12); display: grid; gap: 1px; font-size: 9.5px; }
.wf.phone .toast { left: 8px; right: 8px; top: 8px; width: auto; }
.wf .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; text-align: center; font-size: 14px; font-weight: 600; }
.wf .keypad span { padding: 6px 0; }
.wf .qr { width: 86px; height: 86px; background: conic-gradient(var(--wf-ink) 25%, var(--wf-fill2) 0 50%, var(--wf-ink) 0 75%, var(--wf-fill2) 0) 0 0 / 14px 14px; border: 6px solid var(--wf-bg); outline: 1px solid var(--wf-line); justify-self: center; }
.wf .card { max-width: 190px; width: 100%; aspect-ratio: 1.586; border-radius: 8px; background: var(--wf-fill2); padding: 8px; display: grid; align-content: space-between; font-weight: 700; font-size: 9px; }
.wf .people { display: flex; gap: 8px; }
.wf .people span { display: grid; justify-items: center; gap: 2px; font-size: 8.5px; font-weight: 600; }
.wf .people span::before { content: attr(data-i); width: 28px; height: 28px; border-radius: 50%; background: var(--wf-fill2); display: grid; place-items: center; font-size: 10px; }
.wf .people .on::before { background: var(--wf-strong); color: var(--wf-on-strong); }
.wf .steps { display: flex; gap: 4px; } .wf .steps i { height: 3px; flex: 1; border-radius: 2px; background: var(--wf-fill2); } .wf .steps i.on { background: var(--wf-ink); }
.wf .chart { height: 70px; border-bottom: 1px solid var(--wf-line); display: flex; align-items: flex-end; gap: 4px; padding: 0 4px; }
.wf .chart i { flex: 1; background: var(--wf-fill2); } .wf .chart i:nth-child(odd) { background: var(--wf-ink2); }
.wf .toggle { display: inline-block; vertical-align: middle; width: 22px; height: 12px; border-radius: 6px; background: var(--wf-fill2); position: relative; flex: none; }
.wf .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--wf-bg); }
.wf .toggle.on { background: var(--wf-strong); } .wf .toggle.on::after { left: 12px; }
.wf .spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--wf-fill2); border-top-color: var(--wf-ink); justify-self: center; }
.wf .tl { display: grid; gap: 6px; } .wf .tl div { display: grid; grid-template-columns: 12px 1fr; gap: 6px; font-size: 9.5px; }
.wf .tl div::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--wf-ink); margin-top: 1px; }
.wf .tl div.done::before { background: var(--wf-ink); } .wf .tl div.todo::before { border-color: var(--wf-fill2); }
.wf .n { justify-self: start; align-self: start; display: inline-grid; place-items: center; min-width: 14px; height: 14px; border-radius: 7px; background: var(--note); color: #fff; font: 700 8.5px var(--f); padding: 0 3px; vertical-align: middle; margin-left: 3px; }
.notes .n { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 8px; background: var(--note); color: #fff; font: 700 9.5px var(--f); }
</style>

<div class="app">
  <header class="top">
    <div><h1>Aura journeys and wireframes</h1>
      <p>The product skeleton for the redesign: every customer journey as numbered steps, with placement, buttons, and what opens what. No colour, type, or style yet; that comes after this is locked. Numbered orange markers point to the notes under each frame.</p></div>
    <div class="row" style="display:flex;gap:12px;flex-wrap:wrap">
      <div><span class="legend" id="lblDev">Device</span><div class="seg" role="group" aria-labelledby="lblDev" id="devSeg"><button type="button" data-dev="both" aria-pressed="true">Both</button><button type="button" data-dev="desk" aria-pressed="false">Desktop</button><button type="button" data-dev="phone" aria-pressed="false">Phone</button></div></div>
    </div>
  </header>
  <nav class="index" aria-label="Journeys" id="index"></nav>
  <main id="out" aria-live="polite"></main>
</div>

<script>
/* ———— Kit ———— */
const n = (k) => `<span class="n">${k}</span>`;
const btn = (label, kind = "", k) => `<span class="btn ${kind}">${label}${k ? n(k) : ""}</span>`;
const inp = (label, value, opts = {}) => `<div class="fl"><span>${label}${opts.k ? n(opts.k) : ""}</span><div class="inp ${opts.ph ? "ph" : ""} ${opts.err ? "err" : ""}"><span>${value}</span>${opts.right ? `<span class="muted">${opts.right}</span>` : ""}</div>${opts.hint ? `<span class="hint">${opts.hint}</span>` : ""}${opts.err ? `<span class="errtxt">${opts.err}</span>` : ""}</div>`;
const li = (av, t, sub, v, vsub, k) => `<div class="li"><span class="av">${av}</span><div><span class="t">${t}${k ? n(k) : ""}</span>${sub ? `<small>${sub}</small>` : ""}</div><div class="v">${v || ""}${vsub ? `<small>${vsub}</small>` : ""}</div></div>`;
const kv = (k, v) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`;
const chips = (list, on = 0) => `<div class="chips">${list.map((c, i) => `<span class="chip ${i === on ? "on" : ""}">${c}</span>`).join("")}</div>`;
const segc = (list, on = 0) => `<div class="segc">${list.map((c, i) => `<span class="${i === on ? "on" : ""}">${c}</span>`).join("")}</div>`;
const banner = (text, action, solid) => `<div class="banner ${solid ? "solid" : ""}"><span>${text}</span>${action ? `<b>${action}</b>` : ""}</div>`;
const skel = (w = "100%") => `<div class="skel" style="width:${w}"></div>`;
const table = (cols, rows, tmpl) => `<div><div class="th" style="grid-template-columns:${tmpl}">${cols.map((c, i) => `<span class="${i > 1 ? "r" : ""}">${c}</span>`).join("")}</div>${rows.map((r) => `<div class="tr" style="grid-template-columns:${tmpl}">${r.map((c, i) => `<span class="${i > 1 ? "r" : ""}">${c}</span>`).join("")}</div>`).join("")}</div>`;
const people = (list, on = 0) => `<div class="people">${list.map(([i, l], x) => `<span data-i="${i}" class="${x === on ? "on" : ""}">${l}</span>`).join("")}</div>`;
const steps = (count, at) => `<div class="steps">${Array.from({ length: count }, (_, i) => `<i class="${i < at ? "on" : ""}"></i>`).join("")}</div>`;
const tl = (items) => `<div class="tl">${items.map(([s, t]) => `<div class="${s}"><span>${t}</span></div>`).join("")}</div>`;
const toggle = (on) => `<span class="toggle ${on ? "on" : ""}"></span>`;
const setRow = (t, sub, right, k) => `<div class="li" style="grid-template-columns:1fr auto"><div><span class="t">${t}${k ? n(k) : ""}</span>${sub ? `<small>${sub}</small>` : ""}</div><div class="v">${right}</div></div>`;
const keypad = `<div class="keypad">${["1","2","3","4","5","6","7","8","9",".","0","⌫"].map((x) => `<span>${x}</span>`).join("")}</div>`;
const ex = `<span class="chip">Example data</span>`;

const RAIL = ["Home", "Activity", "Earn", "Cards"];
function desk(active, body, overlay = "", opts = {}) {
  return `<div class="wf desk"><div class="rail"><span class="logo"></span>${RAIL.map((r) => `<i class="${r === active ? "on" : ""}" title="${r}">${r.slice(0, 4)}</i>`).join("")}<span style="flex:1"></span><i class="${active === "Account" ? "on" : ""}">Acct</i></div>
    <div class="dcol"><div class="dbar"><span class="search">Search or jump to… <b>⌘K</b></span><span class="sp"></span>${opts.guest ? btn("Sign in", "pri") : `${btn("Move money", "pri", opts.moveK)}<span class="ico">🔔${opts.bellK ? n(opts.bellK) : ""}</span><span class="ico">JC</span>`}</div>
    <div class="dmain">${body}</div></div>${overlay}</div>`;
}
const PTABS = ["Home", "Activity", "Move", "Cards", "Account"];
function phone(title, body, opts = {}) {
  const top = opts.bare ? "" : `<div class="pbar">${opts.back ? `<span class="ico">‹</span>` : ""}<b>${title}</b><span class="sp" style="flex:1"></span>${opts.right || ""}</div>`;
  const tabs = opts.tabs === false ? "" : `<div class="tabs">${PTABS.map((t) => `<span class="${t === opts.tab ? "on" : ""} ${t === "Move" ? "mv" : ""}">${t}</span>`).join("")}</div>`;
  const foot = opts.foot ? `<div style="padding:8px 12px 12px;display:grid;gap:6px">${opts.foot}</div>` : "";
  return `<div class="wf phone">${top}<div class="pmain">${body}</div>${foot}${tabs}${opts.overlay || ""}</div>`;
}
const drawer = (title, body, foot, k) => `<div class="scrim"></div><div class="drawer"><div class="ohead"><b>${title}${k ? n(k) : ""}</b><span class="ico">✕</span></div><div class="obody">${body}</div>${foot ? `<div class="ofoot">${foot}</div>` : ""}</div>`;

J.push({ id: "J7", group: "Move money", title: "Swap", goal: "Convert between assets, or move one to another network, at a price I understand.", from: "Move money › Swap, an asset's Swap, Home's Swap",

<script>
/* ———— Viewer ———— */
const state = { j: 0, dev: "both" };
try { Object.assign(state, JSON.parse(localStorage.getItem("aura-wf") || "{}")); } catch (e) {}
function render() {
  if (!J[state.j]) state.j = 0;
  const groups = [...new Set(J.map((j) => j.group))];
  document.getElementById("index").innerHTML = groups.map((g) => `<h2>${g}</h2>${J.map((j, i) => j.group === g ? `<a href="#${j.id}" data-i="${i}" aria-current="${i === state.j}"><b>${j.id}</b><span>${j.title}</span></a>` : "").join("")}`).join("");
  const j = J[state.j];
  if (!j) return;
  const frames = j.steps.map((s, i) => {
    const d = state.dev !== "phone" && s.d ? `<div class="scroller">${s.d}</div>` : "";
    const m = state.dev !== "desk" && s.m ? s.m : "";
    if (!d && !m) return "";
    return `<section class="step" aria-label="Step ${i + 1}: ${s.t}"><span class="lbl"><i>${j.id}.${i + 1}</i>${s.t}</span><div class="board" style="gap:12px">${d}${m}</div><ul class="notes">${(s.notes || []).map((x, k) => `<li><span class="n">${k + 1}</span><span>${x}</span></li>`).join("")}</ul></section>`;
  }).join("");
  document.getElementById("out").innerHTML = `<div class="jhead"><h2>${j.id} · ${j.title}</h2><div class="meta"><span><b>Goal</b> ${j.goal}</span><span><b>Starts from</b> ${j.from}</span></div>${j.intro ? `<p>${j.intro}</p>` : ""}</div>
    <div class="board" style="flex-direction:column;gap:32px">${frames}</div>
    ${j.open ? `<div class="open"><h3>Decisions to make</h3><ul>${j.open.map((o) => `<li>${o}</li>`).join("")}</ul></div>` : ""}`;
  document.querySelectorAll("#devSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.dev === state.dev)));
  try { localStorage.setItem("aura-wf", JSON.stringify(state)); } catch (e) {}
}
document.getElementById("index").addEventListener("click", (e) => { const a = e.target.closest("a[data-i]"); if (!a) return; e.preventDefault(); state.j = Number(a.dataset.i); render(); window.scrollTo(0, 0); });
document.getElementById("devSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.dev = b.dataset.dev; render(); });
const hash = location.hash.slice(1); const hi = J.findIndex((j) => j.id === hash); if (hi >= 0) state.j = hi;
render();
</script>
